<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Login</title>
    <link rel='stylesheet' href='{{ url_for("static", filename="css/style.css") }}'>
</head>
<body>

<div class='container'>

    <div class='ai-box' style='max-width:400px;text-align:center;'>

        <h1>Login</h1>

        {% if error %}
            <p style='color:red;'>{{ error }}</p>
        {% endif %}

        <form method='POST'>

            <input type='text'
                   name='username'
                   placeholder='Username'
                   required
                   style='width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:1px solid #ccc;'>

            <input type='password'
                   name='password'
                   placeholder='Password'
                   required
                   style='width:100%;padding:12px;margin-bottom:20px;border-radius:8px;border:1px solid #ccc;'>

            <button type='submit'
                    style='width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold;'>
                Login
            </button>

        </form>

        <p style='margin-top:20px;color:#6b7280;'>
            Demo credentials: <b>admin / admin123</b>
        </p>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>File Search</title>
    <link rel='stylesheet' href='{{ url_for("static", filename="css/style.css") }}'>
</head>
<body>

<div class='container'>

    <h1>File Search</h1>

    <form method='POST'>

        <input type='text'
               name='keyword'
               placeholder='Enter file name'
               value='{{ keyword }}'
               style='padding:12px;width:300px;border-radius:8px;border:1px solid #ccc;'>

        <button type='submit'
                style='padding:12px 20px;border:none;background:#2563eb;color:white;border-radius:8px;'>
            Search
        </button>

    </form>

    <br><br>

    {% if results %}

        <h2>Results</h2>

        <ul style='list-style:none;padding:0;'>

            {% for file in results %}

                <li style='background:white;margin:10px auto;padding:12px;border-radius:8px;max-width:400px;'>
                    {{ file }}
                </li>

            {% endfor %}

        </ul>

    {% elif keyword %}

        <p>No files found.</p>

    {% endif %}

    <br>

    <a href='/' class='btn'>Back to Dashboard</a>

</div>

</body>
</html>
